name: Dependency Audit

on:
  pull_request:
    branches:
      - chore/fase-1-seguranca-confiabilidade

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Baseline audit
        run: npm audit --json || true
      - name: Simulate safe dependency changes
        run: |
          npm uninstall xlsx
          npm install drizzle-orm@0.45.2
          npm audit fix
      - name: Audit after safe changes
        run: npm audit --json || true
      - name: Show dependency diff
        run: git diff -- package.json package-lock.json
