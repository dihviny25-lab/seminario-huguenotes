name: Dependency Audit

on:
  pull_request:
    branches:
      - chore/fase-1-seguranca-confiabilidade

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply safe dependency changes
        run: |
          npm uninstall xlsx
          npm install read-excel-file@9.3.10 drizzle-orm@0.45.2
          npm install -D vitest@4.1.11
          npm audit fix || true
      - name: Audit updated tree
        run: npm audit --json || true
      - name: Typecheck updated tree
        run: npm run typecheck
      - name: Lint updated tree
        run: npm run lint
      - name: Test updated tree
        run: npm test
      - name: Build updated tree
        run: npm run build
      - name: Commit validated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: atualiza dependencias vulneraveis"
          git push origin HEAD:${{ github.head_ref }}
